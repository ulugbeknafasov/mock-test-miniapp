<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock Test</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #222;
}

.container {
    max-width: 500px;
    margin: auto;
}

.welcome {
    margin: 10px 5px 25px;
}

.welcome h1 {
    font-size: 24px;
    margin: 0 0 8px;
}

.welcome p {
    color: #777;
    margin: 0;
}

button {
    width: 100%;
    border: 0;
    border-radius: 15px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

.main-button {
    height: 58px;
    margin-bottom: 12px;
    background: #2481cc;
    color: white;
}

.small-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.small-button {
    height: 58px;
    background: white;
    color: #222;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.message {
    display: none;
    margin-top: 15px;
    padding: 15px;
    background: white;
    border-radius: 15px;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

    <div class="welcome">
        <h1 id="welcomeText">👋 Assalomu alaykum!</h1>
        <p>Mock Test platformasiga xush kelibsiz.</p>
    </div>

    <button class="main-button" onclick="startTest()">
        📝 Testni boshlash
    </button>

    <div class="small-buttons">

        <button class="small-button" onclick="showResults()">
            📊 Natijalarim
        </button>

        <button class="small-button" onclick="showProfile()">
            👤 Profil
        </button>

    </div>

    <div id="message" class="message"></div>

</div>

<script>
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const user = tg.initDataUnsafe?.user;

if (user) {
    let name = user.first_name || "";

    if (user.last_name) {
        name += " " + user.last_name;
    }

    document.getElementById("welcomeText").textContent =
        "👋 Assalomu alaykum, " + name + "!";
}

function startTest() {
    showMessage(
        "📝 Testni boshlash\n\n" +
        "Test kodini kiritish bo‘limi shu yerda bo‘ladi."
    );
}

function showResults() {
    showMessage(
        "📊 Natijalarim\n\n" +
        "Test natijalaringiz shu yerda chiqadi."
    );
}

function showProfile() {
    showMessage(
        "👤 Profil\n\n" +
        "Profil sozlamalari shu yerda bo‘ladi."
    );
}

function showMessage(text) {
    const message = document.getElementById("message");

    message.textContent = text;
    message.style.display = "block";
}
</script>

</body>
</html>
